<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--navy:#101c2b;--blue:#087fc1;--cyan:#11b9e8;--ink:#18212c;--muted:#6d7783;--line:#e1e6eb;--paper:#f4f6f8;--green:#168447;--red:#c0392b;--card:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.45 Inter,Arial,sans-serif;background:var(--paper);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:#fff}
input:focus,textarea:focus{border-color:var(--blue);outline:3px solid #11b9e855}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h1,h2{font-family:"Barlow Condensed",Impact,sans-serif}
.eyebrow{margin:0 0 10px;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.btn{display:inline-block;background:var(--cyan);color:#062237;border:0;border-radius:6px;padding:13px 18px;cursor:pointer;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.hazard{height:10px;background:repeating-linear-gradient(135deg,#f2c200 0 14px,#101c2b 14px 28px)}
.logo{object-fit:contain}
/* ===== PANTALLA 1: LOGIN ===== */
#login{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 85% 15%,#087fc155,transparent 35%),linear-gradient(120deg,#101c2b,#19374f)}
.login-wrap{flex:1;display:grid;place-items:center;padding:24px}
.login-card{width:min(400px,100%);background:#fff;border-radius:12px;padding:28px 26px;display:grid;gap:14px;box-shadow:0 24px 60px #0007;border-top:4px solid var(--cyan)}
.login-head{display:flex;align-items:center;gap:14px;justify-content:center}
.login-head img{width:76px;height:56px}
.login-head h2{margin:0;font-size:46px;font-weight:800;letter-spacing:.04em;line-height:1;color:var(--navy)}
.login-card .eyebrow{text-align:center;margin:0}
label{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:5px;letter-spacing:.04em}
#lerr{color:var(--red);text-align:center;min-height:18px;font-size:14px}
/* ===== PANTALLA 2: ADMIN ===== */
.topbar{min-height:78px;padding:10px clamp(16px,4vw,60px);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:76px;height:54px}
.brand h1{margin:0;font-size:34px;font-weight:800;letter-spacing:.04em;line-height:1;color:var(--navy)}
.brand small{display:block;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.18em}
.hbtns{display:flex;gap:8px}.hbtns .btn{padding:11px 14px}
.hero{padding:34px clamp(18px,6vw,90px);background:radial-gradient(circle at 85% 20%,#087fc144,transparent 30%),linear-gradient(120deg,#101c2b,#19374f);color:#fff}
.hero .eyebrow{color:var(--cyan)}
.hero h2{margin:0 0 6px;font-size:clamp(30px,5vw,44px);font-weight:800;line-height:1.05}
.hero p{margin:0 0 20px;color:#c3d1de}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px}
.stat{background:#ffffff14;border:1px solid #ffffff2a;border-radius:10px;padding:12px 14px}
.stat b{font-family:"Barlow Condensed",Impact,sans-serif;font-size:36px;display:block;line-height:1}
.stat span{color:#c3d1de;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.stat.ok b{color:#5fe0a0}.stat.no b{color:#ff8a7a}
main{max-width:1000px;margin:0 auto;padding:24px 20px 50px}
.heading{margin-bottom:14px}.heading h2{margin:0;font-size:34px;color:var(--navy)}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}
.row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;margin-bottom:10px;transition:.2s}
.row:hover{border-color:var(--cyan);box-shadow:0 6px 18px #101c2b14}
.row img,.ph{width:76px;height:76px;object-fit:cover;border-radius:8px;background:var(--paper);display:grid;place-items:center;color:var(--muted);font-weight:800}
.row b{display:block;font-size:16px}.row small{color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts button{padding:9px 12px;font-size:11px}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--green);color:#fff;margin-left:8px;vertical-align:middle}.chip.off{background:var(--red)}.chip.hid{background:var(--muted)}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);background:#fff;color:var(--ink);border-top:4px solid var(--cyan)}
dialog::backdrop{background:#000a}
dialog form{padding:22px;display:grid;gap:12px}
dialog h2{margin:0 0 4px;font-size:32px;color:var(--navy)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:16px;flex-wrap:wrap}.chk label{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}.chk input{width:auto}
#prev{max-width:140px;border-radius:8px;display:none}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:8px;display:none;z-index:99;box-shadow:0 6px 20px #0006}
.costo{display:block;margin-top:2px}.hint{margin:0;font-size:13px;font-weight:600;min-height:18px}
.empty{text-align:center;color:var(--muted);padding:44px 0}
.promo-box{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.promo-box summary{cursor:pointer;padding:16px 18px;font-weight:800;color:var(--navy);list-style:none}
.promo-box summary::-webkit-details-marker{display:none}
.promo-box summary::after{content:"▾";float:right;color:var(--muted)}
.promo-box[open] summary::after{content:"▴"}
.promo-form{padding:0 18px 18px;display:grid;gap:12px}
.promo-form .chk{margin-top:2px}
.promo-prev{border-radius:10px;padding:16px 18px;background:linear-gradient(120deg,#101c2b,#19374f);color:#fff;display:flex;align-items:center;gap:14px}
.promo-prev .pp-badge{flex:0 0 auto;min-width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:#ffc400;color:#111;font:900 22px "Barlow Condensed",sans-serif;transform:rotate(-8deg)}
.promo-prev b{display:block;font-size:11px;letter-spacing:.12em;color:#ffd75e}
.promo-prev strong{display:block;font:800 24px/1.1 "Barlow Condensed",sans-serif}
.promo-prev small{color:#c3d1de}
.promo-state{font-size:12px;font-weight:700;color:var(--muted)}
@media(max-width:560px){.row{grid-template-columns:62px 1fr}.row img,.ph{width:62px;height:62px}.acts{grid-column:1/-1;justify-content:flex-start}.two{grid-template-columns:1fr}.brand img{width:54px;height:40px}.brand h1{font-size:28px}.stat b{font-size:28px}}
</style>
</head>
<body>
<section id="login" hidden>
  <div class="login-wrap"><div class="login-card">
    <div class="login-head"><img src="fotos/icono-jl-camion.png" alt="JL Camiones" class="logo" onerror="this.onerror=null;this.src='fotos/logo-jl-camiones-preview.png'"><h2>ADMIN</h2></div>
    <p class="eyebrow">JL CAMIONES · INVENTARIO</p>
    <label>CORREO<input id="email" type="email" autocomplete="username"></label>
    <label>CONTRASEÑA<input id="pass" type="password" autocomplete="current-password"></label>
    <button class="btn" id="enter">Entrar</button>
    <div id="lerr" role="alert"></div>
  </div></div>
  <div class="hazard"></div>
</section>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><img src="fotos/icono-jl-camion.png" alt="JL Camiones" class="logo" onerror="this.onerror=null;this.src='fotos/logo-jl-camiones-preview.png'"><div><h1>ADMIN</h1><small>JL CAMIONES</small></div></div>
    <div class="hbtns"><a class="btn ghost" href="index.html" target="_blank">Ver tienda ↗</a><button class="btn ghost" id="out">Salir</button></div>
  </header>
  <section class="hero">
    <p class="eyebrow">PANEL DE INVENTARIO</p>
    <h2>Administra tus repuestos</h2>
    <p>Agrega, edita o marca como agotado. La tienda se actualiza al instante.</p>
    <div class="stats"><div class="stat"><b id="s1">0</b><span>Repuestos</span></div><div class="stat ok"><b id="s2">0</b><span>Disponibles</span></div><div class="stat no"><b id="s3">0</b><span>Agotados</span></div></div>
  </section>
  <div class="hazard"></div>
  <main>
    <details class="promo-box" id="promo-box">
      <summary>🔥 Promoción de la tienda <span class="promo-state" id="promo-state"></span></summary>
      <form class="promo-form" id="promo-form">
        <div class="chk"><label><input type="checkbox" name="activa"> Mostrar la promoción en la tienda</label></div>
        <div class="two"><label>Etiqueta<input name="etiqueta" maxlength="40" placeholder="Ej: PROMOCIÓN DEL MES"></label>
        <label>Descuento destacado (círculo amarillo)<input name="destacado" maxlength="12" placeholder="Ej: -10%"></label></div>
        <label>Título *<input name="titulo" maxlength="90" placeholder="Ej: 10% de descuento en filtros"></label>
        <label>Texto<textarea name="texto" rows="2" maxlength="200" placeholder="Explica la promoción en una o dos frases"></textarea></label>
        <div class="two"><label>Vigencia<input name="vigencia" maxlength="80" placeholder="Ej: Hasta el 30 de noviembre"></label>
        <label>Texto del botón<input name="boton" maxlength="30" placeholder="QUIERO LA PROMO"></label></div>
        <div class="promo-prev" aria-label="Vista previa"><div class="pp-badge" id="pp-badge"></div><div><b id="pp-et"></b><strong id="pp-ti"></strong><small id="pp-tx"></small></div></div>
        <div class="acts"><button class="btn" type="submit" id="promo-save">Guardar promoción</button></div>
      </form>
    </details>
    <div class="heading"><p class="eyebrow">TU INVENTARIO</p><h2>Lista de repuestos</h2></div>
    <div class="bar"><input id="q" type="search" placeholder="Buscar por nombre, marca o categoría..." aria-label="Buscar"><button class="btn ghost" id="export">⬇ Exportar a Excel</button><button class="btn" id="new">+ Agregar repuesto</button></div>
    <div id="list"></div>
  </main>
</div>

<dialog id="dlg"><form id="f" method="dialog">
  <h2 id="dtitle">Agregar repuesto</h2>
  <label>Nombre *<input name="nombre" required></label>
  <div class="two"><label>Marca<input name="marca" list="marcas"></label><label>Categoría<input name="categoria" list="cats"></label></div>
  <datalist id="marcas"></datalist><datalist id="cats"></datalist>
  <div class="two"><label>Modelo / aplicación<input name="modelo"></label><label>Código<input name="codigo"></label></div>
  <label>Descripción<textarea name="descripcion" rows="3"></textarea></label>
  <div class="two"><label>Precio de compra (USD) * <small>lo que te cobra tu proveedor</small><input name="precio_compra" type="number" step="0.01" min="0" required></label>
  <label>Precio de venta (USD) *<input name="precio" type="number" step="0.01" min="0" required></label></div>
  <p id="margen" class="hint" aria-live="polite"></p>
  <div class="two">
  <label>Cantidad en inventario *<input name="cantidad" type="number" step="1" min="0" required placeholder="Ej: 5"></label></div>
  <label id="fotoField" hidden>Foto (solo desarrollador)<input id="file" type="file" accept="image/*"></label>
  <img id="prev" alt="Vista previa">
  <div class="chk"><label><input type="checkbox" name="visible" checked> Visible en la tienda</label></div>
  <div class="acts"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn" id="save" type="submit">Guardar</button></div>
</form></dialog>
<div id="msg" role="status"></div>

<script src="xlsx-lite.js"></script>
<script>
const $ = s => document.querySelector(s);
let items = [], editing = null, newFoto = null;
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fotoUrl = f => !f ? "" : /^https?:/i.test(f) ? f : "fotos/" + encodeURIComponent(f);
function toast(t){const m=$("#msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",2500)}

async function call(action, body){
  const o = {method:"POST",credentials:"same-origin",headers:{"X-Requested-With":"fetch"}};
  if (body instanceof FormData) o.body = body; else { o.headers["Content-Type"]="application/json"; o.body = JSON.stringify(body||{}); }
  try { const r = await fetch("admin-api.php?action="+action, o); const j = await r.json().catch(()=>({ok:false,error:"Respuesta inválida"}));
    if (r.status===401 && action!=="login" && action!=="me") init(); return j; }
  catch { return {ok:false,error:"No hay conexión con el servidor"}; }
}
async function init(){
  const s = await call("me"); isDev = s.rol === "dev"; const bs = document.querySelector(".brand small"); if (bs) bs.textContent = isDev ? "JL CAMIONES · MODO DESARROLLADOR" : "JL CAMIONES"; $("#login").hidden = !!s.ok; $("#app").hidden = !s.ok;
  if (s.ok) { load(); loadPromo(); }
}
$("#enter").onclick = async () => {
  const r = await call("login",{email:$("#email").value.trim(),pass:$("#pass").value});
  if (r.ok) init(); else $("#lerr").textContent = r.error || "Correo o contraseña incorrectos.";
};
$("#pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("#enter").click()});
$("#out").onclick = async () => { await call("logout"); init(); };

async function loadPromo(){
  const r = await call("promo_get"); if (!r.ok) return;
  const p = r.promo || {}, f = $("#promo-form").elements;
  f.activa.checked = !!p.activa;
  ["etiqueta","destacado","titulo","texto","vigencia","boton"].forEach(k => f[k].value = p[k] || "");
  updPromo();
}
function updPromo(){
  const f = $("#promo-form").elements;
  $("#pp-badge").textContent = f.destacado.value; $("#pp-badge").style.display = f.destacado.value ? "grid" : "none";
  $("#pp-et").textContent = "🔥 " + (f.etiqueta.value || "PROMOCIÓN");
  $("#pp-ti").textContent = f.titulo.value || "Título de la promoción";
  $("#pp-tx").textContent = f.texto.value;
  $("#promo-state").textContent = f.activa.checked ? "· ACTIVA" : "· apagada";
  $("#promo-state").style.color = f.activa.checked ? "var(--green)" : "var(--muted)";
}
$("#promo-form").addEventListener("input", updPromo);
$("#promo-form").onsubmit = async e => {
  e.preventDefault();
  const f = $("#promo-form").elements, b = $("#promo-save"); b.disabled = true;
  const r = await call("promo_save", {activa:f.activa.checked, etiqueta:f.etiqueta.value, destacado:f.destacado.value, titulo:f.titulo.value, texto:f.texto.value, vigencia:f.vigencia.value, boton:f.boton.value});
  b.disabled = false;
  toast(r.ok ? (f.activa.checked ? "Promoción guardada y visible en la tienda" : "Promoción guardada (apagada)") : "Error: " + r.error);
};
$("#export").onclick = () => {
  if (!items.length) return toast("No hay repuestos para exportar");
  descargarInventarioXlsx(items); toast("Descargando inventario…");
};
async function load(){
  const r = await call("list"); if (!r.ok) return toast("No se pudo cargar: "+r.error);
  items = r.items; render();
  $("#s1").textContent=items.length; $("#s2").textContent=items.filter(i=>!i.agotado).length; $("#s3").textContent=items.filter(i=>i.agotado).length;
  const uniq = k => [...new Set(items.map(i=>i[k]).filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join("");
  $("#marcas").innerHTML = uniq("marca"); $("#cats").innerHTML = uniq("categoria");
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const list = items.filter(p => [p.nombre,p.marca,p.categoria,p.modelo,p.codigo].join(" ").toLowerCase().includes(q));
  $("#list").innerHTML = list.length ? list.map(p => `
    <article class="row">
      ${p.foto ? `<img src="${esc(fotoUrl(p.foto))}" alt="" loading="lazy">` : `<div class="ph">JL</div>`}
      <div><b>${esc(p.nombre)}${p.agotado?'<span class="chip off">Agotado</span>':'<span class="chip">Disponible</span>'}${p.visible?'':'<span class="chip hid">Oculto</span>'}</b>
        <small>${esc(p.marca)} · ${esc(p.categoria)} · $${Number(p.precio).toFixed(2)} USD · <strong>${p.cantidad} ${p.cantidad===1?"unidad":"unidades"}</strong></small>
        <small class="costo">Compra $${Number(p.precio_compra).toFixed(2)} · Venta $${Number(p.precio).toFixed(2)} · Ganancia $${(p.precio-p.precio_compra).toFixed(2)}${p.precio>0?` (${Math.round((p.precio-p.precio_compra)/p.precio*100)}%)`:""}</small></div>
      <div class="acts"><button class="btn ghost" data-stock="${p.id}">${p.agotado?"Marcar disponible":"Marcar agotado"}</button>
        <button class="btn ghost" data-edit="${p.id}">Editar</button><button class="btn danger" data-del="${p.id}">Eliminar</button></div>
    </article>`).join("") : `<p class="empty">No hay repuestos${q?" con esa búsqueda":" todavía. Usa “Agregar repuesto”"}.</p>`;
}
$("#q").oninput = render;
$("#list").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  const id = +(b.dataset.stock || b.dataset.edit || b.dataset.del), p = items.find(x=>x.id===id);
  if (b.dataset.stock) { const r=await call("stock",{id,agotado:!p.agotado}); r.ok?(toast("Actualizado"),load()):toast(r.error); }
  if (b.dataset.edit) openForm(p);
  if (b.dataset.del && confirm(`¿Eliminar "${p.nombre}"? No se puede deshacer.`)) { const r=await call("delete",{id}); r.ok?(toast("Eliminado"),load()):toast(r.error); }
};
// Modo desarrollador: si entras con el usuario de desarrollador, aparece el campo de foto
let isDev = false;
function resize(file){return new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),"image/webp",.82)};img.onerror=no;img.src=URL.createObjectURL(file)})}
function openForm(p){
  editing = p || null; newFoto = null; $("#f").reset(); $("#file").value = "";
  $("#dtitle").textContent = p ? "Editar repuesto" : "Agregar repuesto";
  const f = $("#f").elements;
  ["nombre","marca","categoria","modelo","codigo","descripcion","precio","precio_compra","cantidad"].forEach(k => f[k].value = p ? (p[k] ?? "") : "");
  f.visible.checked = p ? p.visible : true;
  updMargen();
  $("#fotoField").hidden = !isDev;
  const pv = $("#prev"); pv.src = isDev && p?.foto ? fotoUrl(p.foto) : ""; pv.style.display = isDev && p?.foto ? "block" : "none";
  $("#dlg").showModal();
}
function updMargen(){
  const f = $("#f").elements, c = parseFloat(f.precio_compra.value), v = parseFloat(f.precio.value), m = $("#margen");
  if (!isFinite(c) || !isFinite(v) || v <= 0) { m.textContent = ""; return; }
  const g = v - c;
  m.textContent = g < 0 ? `Atención: vendes por debajo del costo (pierdes $${(-g).toFixed(2)} por unidad).` : `Ganancia por unidad: $${g.toFixed(2)} · Margen: ${Math.round(g/v*100)}% del precio de venta.`;
  m.style.color = g < 0 ? "var(--red)" : "var(--green)";
}
["precio_compra","precio"].forEach(k => $("#f").elements[k].addEventListener("input", updMargen));
$("#new").onclick = () => openForm();
$("#cancel").onclick = () => $("#dlg").close();
$("#file").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try { newFoto = await resize(file); $("#prev").src = URL.createObjectURL(newFoto); $("#prev").style.display = "block"; }
  catch { toast("No se pudo leer esa imagen"); }
};

$("#f").onsubmit = async e => {
  e.preventDefault();
  const btn = $("#save"); btn.disabled = true; btn.textContent = "Guardando...";
  const f = $("#f").elements, fd = new FormData();
  ["nombre","marca","categoria","modelo","codigo","descripcion","precio","precio_compra","cantidad"].forEach(k => fd.append(k, f[k].value));
  fd.append("visible", f.visible.checked ? "1" : "0");
  if (editing) fd.append("id", editing.id);
  if (isDev && newFoto) fd.append("foto", newFoto, "foto.webp");
  const r = await call("save", fd);
  if (r.ok) { $("#dlg").close(); toast("Guardado"); load(); } else toast("Error: "+r.error);
  btn.disabled = false; btn.textContent = "Guardar";
};

// Cierra el panel solo tras 15 minutos sin actividad
let idleT;
function resetIdle(){ clearTimeout(idleT); idleT = setTimeout(async () => { await call("logout"); init(); toast("Sesión cerrada por inactividad"); }, 15*60*1000); }
["click","keydown","touchstart","mousemove"].forEach(ev => document.addEventListener(ev, resetIdle, {passive:true}));
resetIdle();
init();
</script>
</body>
</html>
